services:
  isik-mock-server:
    image: gematik1/isik-mock-server:latest
    build:
      dockerfile: Dockerfile
      context: .
    container_name: isik-mock-server
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://isik-mock-db:5432/hapi"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "S3cr3t"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect"
    depends_on:
      isik-mock-db:
        condition: service_healthy
  isik-mock-db:
    image: postgres:18-alpine
    container_name: isik-mock-db
    restart: on-failure
    shm_size: 128mb
    environment:
      POSTGRES_DB: "hapi"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "S3cr3t"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U admin -d hapi' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    volumes:
      - mock-server-db:/var/lib/postgresql

volumes:
  mock-server-db:
    name: mock-server-db
